name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias arabichitster \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Arabic Hitster, OU=Dev, O=ArabicHitster, L=Unknown, S=Unknown, C=US"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ../release.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: android
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: arabichitster
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-hitster
          path: app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/app-release.apk
