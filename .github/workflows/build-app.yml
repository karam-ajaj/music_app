name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "{\"version\": \"$VERSION\"}" > src/version.json
          echo "Building version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Restore keystore from secret (Play Store)
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Generate temporary keystore (development)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkey -v -keystore release.keystore -alias nagham \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Nagham, OU=Dev, O=Nagham, L=Unknown, S=Unknown, C=US"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release AAB (Play Store)
        if: github.event.inputs.build_type == 'aab' || (startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '')
        run: cd android && ./gradlew bundleRelease
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ../release.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.KEYSTORE_ALIAS || 'nagham' }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.KEYSTORE_KEY_PASSWORD || 'android' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        if: github.event.inputs.build_type != 'aab'
        run: cd android && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ../release.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.KEYSTORE_ALIAS || 'nagham' }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.KEYSTORE_KEY_PASSWORD || 'android' }}

      - name: Upload APK artifact
        if: github.event.inputs.build_type != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: nagham-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        if: github.event.inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: nagham-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type != 'aab'
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB to Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type == 'aab'
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/bundle/release/app-release.aab
